<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ATB PRO: Аналітика & Сортування</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Geologica:wght@400;600&family=Space+Mono:wght@400;700&family=Nunito:wght@800&family=Caveat:wght@700&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════
   5 КАРДИНАЛЬНО РІЗНИХ ТЕМ
═══════════════════════════════════════════ */
:root {
  --font-main: 'Geologica', sans-serif; --font-title: 'Unbounded', sans-serif;
  --bg: #f3f4f6; --bg-sec: #ffffff; --surface: #ffffff;
  --text: #111827; --text2: #4b5563; --text3: #9ca3af;
  --border: #e5e7eb; --border-focus: #e8001c;
  --red: #e8001c; --green: #16a34a; --yellow: #ffd600;
  --card-r: 16px; --card-border: 1px solid var(--border);
  --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
  --btn-radius: 12px; --anim: all 0.4s cubic-bezier(.4,0,.2,1);
  --img-bg: transparent; --img-blend: multiply;
}

[data-theme="cyber"] {
  --font-main: 'Unbounded', sans-serif; --font-title: 'Unbounded', sans-serif;
  --bg: #fce300; --bg-sec: #000000; --surface: #111111;
  --text: #00ffff; --text2: #ffffff; --text3: #666666;
  --border: #ff003c; --border-focus: #00ffff;
  --red: #ff003c; --green: #00ff00; --yellow: #fce300;
  --card-r: 0px; --card-border: none; --card-shadow: none; --btn-radius: 0px;
  --img-bg: #ffffff; --img-blend: normal;
}
[data-theme="cyber"] .product-card { border-left: 6px solid #00ffff; border-bottom: 6px solid #ff003c; clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px); }
[data-theme="cyber"] .product-card:hover { transform: skewX(-3deg) scale(1.02); filter: drop-shadow(0 0 15px rgba(255,0,60,0.6)); }
[data-theme="cyber"] .card-img-wrap { background: #000; padding: 10px; }
[data-theme="cyber"] .card-img { background: #fff; padding: 10px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
[data-theme="cyber"] body::before { background: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,255,255,0.05) 4px, rgba(0,255,255,0.05) 8px); z-index: -1; }

[data-theme="sakura"] {
  --font-main: 'Nunito', sans-serif; --font-title: 'Caveat', cursive;
  --bg: #fdf2f8; --bg-sec: #fce7f3; --surface: #ffffff;
  --text: #831843; --text2: #db2777; --text3: #f9a8d4;
  --border: #fbcfe8; --border-focus: #db2777;
  --red: #f472b6; --green: #10b981; --yellow: #fde047;
  --card-r: 30px; --card-border: 2px dashed #fbcfe8;
  --card-shadow: 0 10px 25px rgba(244,114,182,0.15); --btn-radius: 24px;
  --img-bg: transparent; --img-blend: multiply;
}
[data-theme="sakura"] .product-card:hover { transform: translateY(-12px) rotate(2deg); box-shadow: 0 20px 40px rgba(244,114,182,0.3); border-color: #f472b6; }
[data-theme="sakura"] .price-current { font-size: 28px; }
[data-theme="sakura"] body::before { background: radial-gradient(circle at 20% 30%, rgba(244,114,182,0.2) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(251,207,232,0.4) 0%, transparent 40%); }

[data-theme="brutal"] {
  --font-main: 'Space Mono', monospace; --font-title: 'Unbounded', sans-serif;
  --bg: #e0dcd0; --bg-sec: #ffffff; --surface: #ffffff;
  --text: #000000; --text2: #222222; --text3: #666666;
  --border: #000000; --border-focus: #e8001c;
  --red: #e8001c; --green: #000000; --yellow: #ffd600;
  --card-r: 0px; --card-border: 4px solid #000000;
  --card-shadow: 8px 8px 0 #000000; --btn-radius: 0px;
  --img-bg: transparent; --img-blend: multiply;
}
[data-theme="brutal"] .product-card:hover { transform: translate(-6px, -6px); box-shadow: 14px 14px 0 #e8001c; border-color: #e8001c; }
[data-theme="brutal"] .btn { border: 3px solid #000; font-weight: 900; text-transform: uppercase; box-shadow: 4px 4px 0 #000; }
[data-theme="brutal"] .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }

[data-theme="hacker"] {
  --font-main: 'Space Mono', monospace; --font-title: 'Space Mono', monospace;
  --bg: #050505; --bg-sec: #000000; --surface: #0a0a0a;
  --text: #00ff00; --text2: #00cc00; --text3: #005500;
  --border: #003300; --border-focus: #00ff00;
  --red: #00ff00; --green: #00ff00; --yellow: #00ff00;
  --card-r: 0px; --card-border: 1px dashed #00ff00;
  --card-shadow: none; --btn-radius: 0px;
  --img-bg: #000000; --img-blend: normal;
}
[data-theme="hacker"] .product-card:hover { box-shadow: 0 0 20px rgba(0,255,0,0.4); background: #001100; border-style: solid; }
[data-theme="hacker"] .card-img { filter: grayscale(100%) sepia(100%) hue-rotate(70deg) contrast(1.5); background: #000; }
[data-theme="hacker"] body::before { background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px); }

/* ═══════════════════════════════════════════
   БАЗОВИЙ CSS
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{ font-family:var(--font-main); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition: background 0.3s; }
header{ position:sticky;top:0;z-index:100; background:var(--bg-sec); border-bottom:1px solid var(--border); padding:0 32px; height:70px; display:flex; align-items:center; gap:24px; }
.logo{ display:flex; align-items:center; gap:10px; text-decoration:none; }
.logo-icon{ width:38px;height:38px;background:var(--red);border-radius:var(--btn-radius);display:grid;place-items:center;font-family:var(--font-title);font-weight:900;font-size:13px;color:var(--bg-sec); }
.logo-text{ font-family:var(--font-title);font-weight:700;font-size:18px;color:var(--text); }
.search-wrap{ flex:1;max-width:560px;position:relative; }
#searchInput{ width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--btn-radius);padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none; transition:var(--anim); }
#searchInput:focus{ border-color:var(--border-focus); }

.app{display:flex;min-height:calc(100vh - 70px);}
aside{ width:320px;flex-shrink:0;background:var(--bg-sec);border-right:1px solid var(--border);padding:24px;position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto;scrollbar-width:none; transition: var(--anim); }
.sidebar-label{ font-family:var(--font-title);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:12px; margin-top:24px;}
.btn{ display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:var(--btn-radius);border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:var(--anim);color:var(--bg-sec);background:var(--red); }
.btn:hover{ filter:brightness(1.1); }
.btn-secondary{ background:var(--surface);color:var(--text);border:1px solid var(--border); }
.theme-select { width: 100%; background: var(--surface); border: 2px solid var(--border); color: var(--text); padding: 12px; border-radius: var(--btn-radius); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; font-weight:700; margin-bottom: 10px;}

.quick-filters { display: flex; flex-wrap: wrap; gap: 8px; }
.q-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--anim); }
.q-btn:hover { background: var(--red); color: var(--bg-sec); border-color: var(--red); }
.q-btn.active { background: var(--red); color: var(--bg-sec); border-color: var(--red); box-shadow: 0 0 10px rgba(232,0,28,0.2); }

main{flex:1;padding:32px;position:relative; width: 100%;}
.results-count{ font-size:16px;color:var(--text2);font-weight:700; margin-bottom: 20px;}

/* ═══════════════════════════════════════════
   3D КАРТКИ З ПЕРЕГОРТАННЯМ
═══════════════════════════════════════════ */
#productsGrid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px; perspective: 1500px; }
.product-card { width: 100%; height: 440px; perspective: 1500px; background: transparent; cursor: pointer; animation:fadeUp .4s ease both; }
.card-inner { position: relative; width: 100%; height: 100%; text-align: left; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
.product-card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: var(--card-border); border-radius: var(--card-r); box-shadow: var(--card-shadow); display: flex; flex-direction: column; overflow: hidden; transition: var(--anim); }
.card-front:hover { border-color: var(--border-focus); }
.card-back { transform: rotateY(180deg); padding: 20px; background: var(--bg-sec); overflow-y: auto; border-color: var(--border-focus); }

.card-img-wrap{ position:relative;height:200px;padding:16px;display:flex;align-items:center;justify-content:center;background:var(--img-bg); }
.card-img{ max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:var(--img-blend); }
.card-badges{ position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px; }
.badge{ padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;background:var(--red);color:var(--bg-sec); }

.card-body{ padding:16px 20px;flex:1;display:flex;flex-direction:column; }
.card-title{ font-size:14px;font-weight:600;line-height:1.4;color:var(--text);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.price-current{ font-family:var(--font-title);font-size:26px;font-weight:800;color:var(--red); }
.price-old{ font-size:13px;color:var(--text3);text-decoration:line-through;font-weight:600; }
.click-hint { margin-top:auto; font-size: 11px; color: var(--text3); text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display:flex; align-items:center; justify-content:center; gap:5px;}
.click-hint::after { content: '↻'; font-size: 14px;}

.back-title { font-family: var(--font-title); font-size: 14px; color: var(--text); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
.chars-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px;}
.chars-table tr { border-bottom: 1px dashed var(--border); }
.chars-table td { padding: 8px 0; color: var(--text2); }
.chars-table td:last-child { text-align: right; font-weight: 700; color: var(--text); }
.spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top: 3px solid var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* АНАЛІТИКА */
.analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; }
.an-card { background: var(--surface); border: var(--card-border); padding: 20px; border-radius: var(--card-r); text-align: center; }
.an-val { font-family: var(--font-title); font-size: 26px; font-weight: 800; color: var(--red); margin-bottom: 4px; }
.an-label { font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase;}
.an-full { grid-column: 1 / -1; display:flex; justify-content: space-between; align-items: center; text-align:left;}

@keyframes fadeUp{ from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* ═══════════════════════════════════════════
   МОБІЛЬНА АДАПТАЦІЯ (TELEPHONE VIEW)
═══════════════════════════════════════════ */
.mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text); font-size: 26px; cursor: pointer; padding: 0 10px 0 0; }
.mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; backdrop-filter: blur(4px); opacity: 0; transition: var(--anim); }
.mobile-overlay.open { display: block; opacity: 1; }
.aside-close { display: none; }

@media (max-width: 850px) {
  .app { flex-direction: column; }
  
  header { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 10px; }
  .mobile-menu-btn { display: block; }
  .logo { margin-right: auto; }
  .header-stats { display: none; } /* Ховаємо стату в хедері для економії місця */
  .search-wrap { order: 4; width: 100%; max-width: 100%; margin-top: 6px; }

  /* Бокова панель стає висувним меню */
  aside { 
    position: fixed; left: -100%; top: 0; height: 100vh; width: 85%; max-width: 340px; 
    z-index: 200; box-shadow: 10px 0 30px rgba(0,0,0,0.5); 
    padding-top: 60px; /* Місце для кнопки закриття */
  }
  aside.open { left: 0; }
  .aside-close { 
    display: flex; align-items: center; justify-content: center; 
    position: absolute; top: 16px; right: 16px; 
    background: var(--surface); border: 1px solid var(--border); 
    width: 36px; height: 36px; border-radius: 50%; 
    color: var(--text); font-size: 16px; cursor: pointer; font-weight: bold;
  }

  main { padding: 16px; }
  #productsGrid { grid-template-columns: 1fr; gap: 16px; } /* Одна колонка на телефоні */
  .product-card { height: 420px; }
  .analytics-grid { grid-template-columns: 1fr; }
  .an-full { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>
<body>

<div class="mobile-overlay" id="mobileOverlay" onclick="toggleMenu()"></div>

<header>
  <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
  <a class="logo" href="#">
    <div class="logo-icon">ATB</div>
    <div class="logo-text">Акції<span>&nbsp;PRO</span></div>
  </a>
  <div class="header-stats">
    <div class="stat-chip"><span class="num" id="totalCount">0</span>&nbsp;в базі</div>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Пошук товарів..."/>
  </div>
</header>

<div class="app">
  <aside>
    <button class="aside-close" onclick="toggleMenu()">✕</button>
    <select id="themeSelect" class="theme-select" onchange="changeTheme(this.value)">
      <option value="light">🛒 АТБ Класика (Світла)</option>
      <option value="cyber">🦾 Кіберпанк 2077</option>
      <option value="sakura">🌸 Сакура (Каваї)</option>
      <option value="brutal">⬛ Бруталізм</option>
      <option value="hacker">💻 Термінал (Хакер)</option>
    </select>

    <button class="btn btn-secondary" onclick="renderAnalytics()" style="margin-bottom: 24px;">📊 Показати Статистику</button>

    <div class="sidebar-label">Завантаження бази</div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input id="maxPage" type="number" value="5" min="1" class="filter-input" style="margin:0; width:80px;" title="Кількість сторінок"/>
      <button class="btn" id="btnLoad" onclick="loadCatalog()" style="margin:0; flex:1;">📥 Завантажити</button>
    </div>

    <div class="sidebar-label">Швидкі Фільтри (10 шт)</div>
    <div class="quick-filters" id="quickFilters">
      <button class="q-btn" data-filter="under50">До 50 ₴</button>
      <button class="q-btn" data-filter="50to100">50 - 100 ₴</button>
      <button class="q-btn" data-filter="over100">Понад 100 ₴</button>
      <button class="q-btn" data-filter="disc30">Знижка > 30%</button>
      <button class="q-btn" data-filter="disc50">Знижка > 40%</button>
      <button class="q-btn" data-filter="sav20">Економія > 20₴</button>
      <button class="q-btn" data-filter="sav50">Економія > 50₴</button>
      <button class="q-btn" data-filter="atbCard">З карткою АТБ</button>
      <button class="q-btn" data-filter="drink">Напої/Пиво</button>
      <button class="q-btn" data-filter="reset" style="background:var(--red); color:var(--bg-sec);">Скинути всі</button>
    </div>

    <div class="sidebar-label">Сортування</div>
    <div class="sort-pills">
      <div class="sort-pill active" onclick="setSort('default', this)">За замовч.</div>
      <div class="sort-pill" onclick="setSort('price_asc', this)">Дешевші</div>
      <div class="sort-pill" onclick="setSort('price_desc', this)">Дорожчі</div>
      <div class="sort-pill" onclick="setSort('discount', this)">% Знижки</div>
      <div class="sort-pill" onclick="setSort('saving', this)">∑ Економія</div>
    </div>

    <button class="btn btn-ghost" onclick="clearAll()" style="color:var(--text3); font-size:11px;">✕ Видалити всі дані</button>
  </aside>

  <main>
    <div class="results-count" id="resultsCount">Завантажте каталог для початку роботи</div>
    
    <div id="analyticsPanel" style="display:none; margin-bottom:30px;">
      <h2 style="font-family:var(--font-title); font-size:18px; margin-bottom:16px;">Аналітика по відфільтрованим товарам</h2>
      <div class="analytics-grid" id="analyticsGrid"></div>
    </div>

    <div id="productsGrid"></div>
  </main>
</div>

<script>
const API = '/api';
let allProducts = [], filteredProducts = [];
let currentSort = 'default', activeQuickFilter = null;
let searchTimer = null;

const el = id => document.getElementById(id);
const toF = v => { const n = parseFloat(String(v||'').replace(',','.')); return isNaN(n) ? null : n; };
const discInt = v => { const m = String(v||'').match(/-?(\d+)/); return m ? parseInt(m[1]) : null; };

// Мобільне меню
function toggleMenu() {
  const aside = document.querySelector('aside');
  const overlay = el('mobileOverlay');
  aside.classList.toggle('open');
  if(aside.classList.contains('open')) {
    overlay.classList.add('open'); document.body.style.overflow = 'hidden';
  } else {
    overlay.classList.remove('open'); document.body.style.overflow = '';
  }
}

// ТЕМИ
const savedTheme = localStorage.getItem('atb_theme_v3') || 'light';
el('themeSelect').value = savedTheme;
changeTheme(savedTheme);

function changeTheme(themeName) {
  if (themeName === 'light') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', themeName);
  localStorage.setItem('atb_theme_v3', themeName);
  if(window.innerWidth <= 850) toggleMenu(); // Закриваємо меню на мобільному після вибору
}

// ЗАВАНТАЖЕННЯ ДАНИХ
async function loadCatalog(){
  allProducts = []; el('btnLoad').textContent = 'В процесі...'; el('btnLoad').disabled = true;
  const maxPage = parseInt(el('maxPage').value) || 5;
  for(let page=1; page<=maxPage; page++){
    try{
      const resp = await fetch(`${API}/catalog/page/${page}`);
      const data = await resp.json();
      if(data.products && data.products.length){
        allProducts.push(...data.products.filter(p=>{
          const key = p.link||p.title; return !allProducts.some(x=>(x.link||x.title)===key);
        }));
        applyFilters();
      } else break;
      el('resultsCount').innerHTML = `Завантажено сторінку ${page}/${maxPage}...`;
    } catch(e){ console.error(e); }
  }
  el('btnLoad').textContent = '📥 Завантажити'; el('btnLoad').disabled = false;
  if(window.innerWidth <= 850 && document.querySelector('aside').classList.contains('open')) toggleMenu();
  applyFilters();
}

function clearAll(){ allProducts = []; applyFilters(); el('analyticsPanel').style.display = 'none'; if(window.innerWidth <= 850) toggleMenu();}

// ПОШУК
el('searchInput').addEventListener('input', () => {
  const q = el('searchInput').value.trim();
  clearTimeout(searchTimer);
  applyFilters();
  if(q && filteredProducts.length < 3) searchTimer = setTimeout(()=>fireSmartSearch(q), 800);
});

async function fireSmartSearch(q){
  try{
    const resp = await fetch(`${API}/search/page?q=${encodeURIComponent(q)}&page=1`);
    const data = await resp.json();
    if(data.products) {
      data.products.forEach(p => { if(!allProducts.some(x=>x.link===p.link)) allProducts.push(p); });
    }
  } catch(e){}
  applyFilters();
}

// 10 ШВИДКИХ ФІЛЬТРІВ
document.querySelectorAll('.q-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    const filter = e.target.getAttribute('data-filter');
    if(filter === 'reset') { activeQuickFilter = null; el('searchInput').value = ''; }
    else { activeQuickFilter = filter; e.target.classList.add('active'); }
    applyFilters();
    if(window.innerWidth <= 850) toggleMenu();
  });
});

// ФІЛЬТРАЦІЯ
function applyFilters(){
  const q = el('searchInput').value.trim().toLowerCase();
  
  filteredProducts = allProducts.filter(p=>{
    const price = toF(p.current_price), sav = p.saving, disc = discInt(p.discount);
    if(q && !String(p.title).toLowerCase().includes(q)) return false;
    
    if(activeQuickFilter) {
      if(activeQuickFilter === 'under50' && price >= 50) return false;
      if(activeQuickFilter === '50to100' && (price < 50 || price > 100)) return false;
      if(activeQuickFilter === 'over100' && price <= 100) return false;
      if(activeQuickFilter === 'disc30' && (!disc || disc < 30)) return false;
      if(activeQuickFilter === 'disc50' && (!disc || disc < 40)) return false;
      if(activeQuickFilter === 'sav20' && (!sav || sav < 20)) return false;
      if(activeQuickFilter === 'sav50' && (!sav || sav < 50)) return false;
      if(activeQuickFilter === 'atbCard' && !p.is_atb_card) return false;
      if(activeQuickFilter === 'drink' && !String(p.title).toLowerCase().match(/пиво|напій|сік|вода|вино|горілка/)) return false;
    }
    return true;
  });
  sortProducts(); renderGrid();
  el('totalCount').textContent = allProducts.length;
  el('resultsCount').innerHTML = `Показано <strong>${filteredProducts.length}</strong> товарів`;
  if(el('analyticsPanel').style.display === 'block') renderAnalytics();
}

function setSort(type, element){
  currentSort = type;
  document.querySelectorAll('.sort-pill').forEach(p=>p.classList.remove('active'));
  element.classList.add('active'); applyFilters();
  if(window.innerWidth <= 850) toggleMenu();
}

function sortProducts(){
  if(currentSort==='price_asc') filteredProducts.sort((a,b)=>(toF(a.current_price)||999)-(toF(b.current_price)||999));
  if(currentSort==='price_desc') filteredProducts.sort((a,b)=>(toF(b.current_price)||0)-(toF(a.current_price)||0));
  if(currentSort==='discount') filteredProducts.sort((a,b)=>(discInt(b.discount)||0)-(discInt(a.discount)||0));
  if(currentSort==='saving') filteredProducts.sort((a,b)=>(b.saving||0)-(a.saving||0));
}

// 3D КАРТКИ З ПЕРЕГОРТАННЯМ
function renderGrid(){
  const grid = el('productsGrid'); grid.innerHTML = '';
  filteredProducts.forEach((p, i) => {
    const card = document.createElement('div'); card.className = 'product-card';
    const price = toF(p.current_price), old = toF(p.old_price), disc = discInt(p.discount), sav = p.saving;
    
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front" onclick="flipCard(this.parentElement.parentElement, '${p.link}')">
          <div class="card-img-wrap">${p.img_url ? `<img class="card-img" src="${p.img_url}"/>` : `<div style="font-size:50px;">🛍</div>`}<div class="card-badges">${disc?`<span class="badge">-${disc}%</span>`:''}${p.is_atb_card?`<span class="badge" style="background:var(--yellow); color:#000;">ATB</span>`:''}</div></div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="price-current">${price||0} <span style="font-size:14px;">₴</span></div>
            ${old && old>price ? `<div class="price-old">${old} ₴</div>`:''}
            <div class="click-hint">Характеристики</div>
          </div>
        </div>
        <div class="card-back">
          <div class="back-title">${p.title}</div>
          <div class="card-back-content"><div class="spinner"></div></div>
          <div style="margin-top:auto; display:flex; gap:10px;">
            <button class="btn" onclick="event.stopPropagation(); window.open('${p.link}','_blank')">🛒 Купити</button>
            <button class="btn btn-secondary" onclick="event.stopPropagation(); this.closest('.product-card').classList.remove('flipped')">✕</button>
          </div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// Функція перегортання та завантаження деталей з бекенду
async function flipCard(cardEl, link) {
  if(!cardEl.classList.contains('flipped')) {
    document.querySelectorAll('.product-card.flipped').forEach(c => c.classList.remove('flipped'));
    cardEl.classList.add('flipped');
    
    const contentEl = cardEl.querySelector('.card-back-content');
    if(contentEl.innerHTML.includes('chars-table')) return; 
    
    try {
      const res = await fetch(`/api/details?url=${encodeURIComponent(link)}`);
      const data = await res.json();
      
      if(!data || Object.keys(data).length === 0 || data.error) {
        contentEl.innerHTML = '<p style="font-size:12px; color:var(--text3); text-align:center;">Детальні характеристики відсутні</p>';
        return;
      }
      
      let html = '<table class="chars-table">';
      for(let key in data) html += `<tr><td>${key}</td><td>${data[key]}</td></tr>`;
      html += '</table>';
      contentEl.innerHTML = html;
      
    } catch(e) {
      contentEl.innerHTML = '<p style="font-size:12px; color:var(--red); text-align:center;">Помилка завантаження</p>';
    }
  }
}

// РОЗШИРЕНА АНАЛІТИКА
function renderAnalytics() {
  if(!filteredProducts.length) return alert("Немає даних для аналізу!");
  el('analyticsPanel').style.display = 'block';
  if(window.innerWidth <= 850) toggleMenu();
  
  let totalP = 0, count = 0, maxD = 0, totalSav = 0, under50 = 0;
  let minItem = null, maxItem = null;
  
  filteredProducts.forEach(p => {
    const pr = toF(p.current_price);
    if(pr) {
      totalP += pr; count++;
      if(pr < 50) under50++;
      if(!minItem || pr < toF(minItem.current_price)) minItem = p;
      if(!maxItem || pr > toF(maxItem.current_price)) maxItem = p;
    }
    const d = discInt(p.discount); if(d > maxD) maxD = d;
    if(p.saving) totalSav += p.saving;
  });
  
  el('analyticsGrid').innerHTML = `
    <div class="an-card"><div class="an-val">${count}</div><div class="an-label">Товарів у вибірці</div></div>
    <div class="an-card"><div class="an-val">${Math.round(totalP/count)||0} ₴</div><div class="an-label">Середня ціна</div></div>
    <div class="an-card"><div class="an-val">-${maxD}%</div><div class="an-label">Макс. знижка</div></div>
    <div class="an-card"><div class="an-val">${Math.round(totalSav)} ₴</div><div class="an-label">Потенційна Економія</div></div>
    <div class="an-card an-full">
      <div><div class="an-label">Найдешевше:</div><div style="font-weight:700; font-size:14px;">${minItem?minItem.title:'-'}</div></div>
      <div class="an-val" style="margin:0;">${minItem?toF(minItem.current_price):0} ₴</div>
    </div>
    <div class="an-card an-full">
      <div><div class="an-label">Найдорожче:</div><div style="font-weight:700; font-size:14px;">${maxItem?maxItem.title:'-'}</div></div>
      <div class="an-val" style="margin:0;">${maxItem?toF(maxItem.current_price):0} ₴</div>
    </div>
  `;
}
</script>
